<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA V ModPack — карта проекта</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; color: #e8eaf1; background: #111522; margin: 0; }
main { max-width: 1100px; margin: auto; padding: 32px 20px; }
h1 { margin-bottom: 4px; } p { color: #b8c0d1; }
input, select { background: #222a3d; border: 1px solid #51617c; border-radius: 8px; color: white; padding: 12px; font: inherit; }
input { width: min(100%, 520px); box-sizing: border-box; } select { margin: 8px; }
#cards { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 14px; margin-top: 20px; }
article { background: #1c2333; border: 1px solid #34405b; border-radius: 12px; padding: 18px; }
article h2 { margin: 0 0 4px; font-size: 20px; } article p { margin: 6px 0 14px; }
.tag { color: #9ad6ff; font-size: 13px; } .missing { color: #ffb6ad; }
a { color: #a8c9ff; } ul { padding-left: 22px; margin: 8px 0; }
</style>
</head>
<body><main>
<h1>GTA V ModPack</h1>
<p>Карта модулей. Это локальный снимок: обновляется командой <code>tools/build-project-map.ps1</code>. Файлы карты никуда не отправляются.</p>
<p><a href="../docs/MODS_RU.md">Моды и клавиши</a> · <a href="../docs/DEVELOPMENT_RU.md">Руководство разработчика</a></p>
<input id="search" type="search" placeholder="Найти мод, клавишу или файл" aria-label="Поиск модулей">
<select id="kind" aria-label="Тип"><option value="">Все типы</option><option value="plugin">Игровые моды</option><option value="tool">Инструменты</option><option value="core">Ядро</option><option value="loader">Загрузчик</option></select>
<p id="count"></p><div id="cards"></div>
</main>
<script>
const modules = /*MODULE_DATA*/[];
if (modules.length === 0) {
  window.location.replace('../.modpack-local/project-map.html');
}
const search = document.getElementById('search'), kind = document.getElementById('kind');
const cards = document.getElementById('cards'), count = document.getElementById('count');
function node(tag, text, parent) { const n = document.createElement(tag); n.textContent = text; parent.appendChild(n); return n; }
function link(label, href, parent) { const a = node('a', label, parent); a.href = href; return a; }
function render() {
  cards.replaceChildren();
  const q = search.value.trim().toLocaleLowerCase();
  const found = modules.filter(m => (!kind.value || m.kind === kind.value) &&
    [m.id,m.name,m.description,m.key,...m.sources.map(s=>s.name)].join(' ').toLocaleLowerCase().includes(q));
  count.textContent = `Найдено: ${found.length} из ${modules.length}`;
  for (const m of found) {
    const card = document.createElement('article'); cards.appendChild(card);
    node('h2', `${m.name} · ${m.id}`, card);
    node('div', `${m.kind}${m.key ? ' · ' + m.key : ''}`, card).className = 'tag';
    node('p', m.description, card); link('Открыть README', m.readme, card);
    if (m.sources.length) {
      const list = node('ul', '', card);
      for (const s of m.sources) { const li = node('li', '', list); link(s.name, s.path, li); }
    }
    const absent = m.live.filter(f=>!f.exists).map(f=>f.name);
    if (absent.length) node('div', `Нет в игре: ${absent.join(', ')}`, card).className='missing';
    if (m.data.length) node('div', `Данные: ${m.data.join(', ')}`, card).className='tag';
  }
}
search.addEventListener('input', render); kind.addEventListener('change', render); render();
</script></body></html>
