<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Карта меню ModPack</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#f1f3f8;background:#10131b;--line:#354054;--muted:#aebbd1;--panel:#1b2230;--blue:#76b9f2}
    *{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
    header{background:#181f2b;border-bottom:1px solid var(--line);padding:18px max(18px,calc((100vw - 1080px)/2))}
    h1{font-size:25px;margin:0 0 6px}p{line-height:1.48;color:var(--muted);margin:4px 0}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.toolbar button,.fileButton,.toolButton{border:1px solid #52627d;background:#29384f;color:#f4f6fc;border-radius:7px;padding:8px 11px}
    .toolbar button:hover,.fileButton:hover,.toolButton:hover{background:#3c526d}.fileButton input{display:none}
    main{max-width:1080px;margin:auto;padding:20px 18px 80px}.crumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:#a7b8d1}
    .crumbs button{border:0;background:none;color:#a9d7ff;padding:4px 0}.crumbs button:hover{text-decoration:underline}
    .pageTitle{font-size:23px;margin:0 0 5px}.subline{color:#b8c6da;margin:0 0 17px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.keyCard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;min-height:105px;display:flex;align-items:center;justify-content:space-between;padding:12px;gap:12px}
    .keyCard:hover{border-color:#95b2da}.keyOpen{border:0;background:none;color:#f4f6fc;text-align:left;flex:1;padding:0}.keyName{font-size:23px;font-weight:800;color:var(--accent)}.keyTitle{font-size:15px;font-weight:600;margin-top:3px}.keyMeta{font-size:12px;color:var(--muted);margin-top:5px}
    .cardTools{display:flex;gap:5px}.editButton{background:#29384f;color:#d8e6fa;border:1px solid #475c78;border-radius:6px;padding:6px 9px}
    .gtaMenu{max-width:690px;background:#1b202b;border:1px solid #4c586c;border-radius:8px;overflow:hidden;box-shadow:0 15px 40px #0005}
    .gtaHead{background:linear-gradient(130deg,#293e60,#1d2739);padding:15px 18px;border-bottom:3px solid var(--accent)}.gtaHead strong{font-size:21px}.gtaHead small{display:block;color:#c6d1e1;margin-top:4px}
    .row{display:flex;align-items:center;gap:8px;border-bottom:1px solid #343d4d;min-height:49px;padding:5px 7px 5px 14px}.row:hover{background:#34425b}.rowMain{border:0;background:transparent;color:var(--item-color);padding:5px 0;text-align:left;display:flex;align-items:center;gap:9px;flex:1;min-height:36px}.rowMain:focus-visible,.editButton:focus-visible{outline:2px solid #fff}
    .rowText{font-weight:600}.rowType{font-size:11px;color:#b9c5d8;background:#273346;border-radius:5px;padding:3px 6px;margin-left:auto}.rowSymbol{font-size:17px;min-width:20px;text-align:center}.row .editButton{font-size:12px}.row.dynamic .rowText:after{content:' · шаблон';font-weight:400;color:#a7b8d0;font-size:11px}
    .menuActions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.menuActions button{background:#26354a;border:1px solid #516381;color:#e7eef9;border-radius:7px;padding:8px 11px}
    .empty{padding:15px;color:#b9c8d9}.legend{max-width:690px;margin-top:18px;color:#b6c2d4;font-size:13px;line-height:1.6}.legend b{color:#fff}
    .notes{max-width:690px;margin-top:24px}.notes textarea{width:100%;min-height:86px;resize:vertical;background:#1a2638;color:#fff;border:1px solid #53647d;border-radius:7px;padding:9px}
    dialog{background:#1c2636;color:#f0f4fb;border:1px solid #647690;border-radius:10px;width:min(550px,calc(100vw - 24px));box-shadow:0 20px 60px #000a}dialog::backdrop{background:#050913ba}dialog h2{margin:0 0 15px;font-size:20px}
    dialog label{display:block;margin:11px 0;color:#becde1;font-size:13px}dialog input,dialog select{width:100%;margin-top:4px;background:#111a28;color:#fff;border:1px solid #657791;border-radius:6px;padding:8px}
    .dialogButtons{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}.dialogButtons button{border:1px solid #627595;background:#354e73;color:white;padding:8px 12px;border-radius:7px}.dialogButtons .danger{background:#743949}
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263c53;border:1px solid #6c9ecb;border-radius:8px;padding:9px 14px;z-index:5;max-width:90vw;display:none}
    .hidden{display:none!important}@media(max-width:600px){header{padding:16px}main{padding:16px}.rowType{display:none}}
  </style>
</head>
<body>
  <header>
    <h1>Карта меню ModPack</h1>
    <p>Это макет текущих игровых меню. Открывай клавиши и подменю, меняй цвета и переноси действия. GTA не меняется.</p>
    <div class="toolbar">
      <button id="home">Все клавиши</button><button id="newGroup">+ Клавиша</button>
      <button id="exportJson">Скачать план JSON</button><button id="exportMd">Скачать текст</button>
      <label class="fileButton">Открыть план<input id="importJson" type="file" accept=".json,application/json"></label>
      <button id="reset">Вернуть исходную карту</button>
    </div>
  </header>
  <main id="app"></main>
  <dialog id="editor"><form method="dialog" id="editorForm">
    <h2 id="editorTitle"></h2><div id="editorFields"></div><div class="dialogButtons" id="editorButtons"></div>
  </form></dialog>
  <div id="toast" role="status"></div>
  <script src="planner.js"></script>
  <script src="planner-ui.js"></script>
</body>
</html>
